# Final configuration for the submitted checkpoint.
# Every field here is consumed by train.py; nothing is hard-coded in the script.

seed: 1337

data:
  zip_path: data/train.zip          # official KLA archive, unmodified
  packed_dir: data/packed           # gt.npy / lr.npy memmaps written by src.data.pack_from_zip
  crop_lr: 64                       # 64x64 LR crop -> 128x128 GT crop
  # Validation split: 10 contiguous blocks of 32, evenly spaced across the
  # index range (indices 0-31, 320-351, ... 2880-2911).  Contiguous so that
  # same-source samples stay together; spaced so val covers all content types.
  # Generated by src.data.val_indices(3200) -- frozen, never trained on.
  n_val_blocks: 10
  val_block_size: 32

model:
  width: 64
  blocks: 16
  in_ch: 1
  global_skip: true                 # bilinear-upsampled input added to output

degradation:
  synth_prob: 0.5                   # fraction of each batch replaced by synthetic pairs
  # (L, sigma) are drawn from empirical quantile tables fitted on all 3200 real
  # pairs -- see src/degrade.py.  `widen` applies a random multiplicative factor
  # on top so the tails extend beyond what was measured.
  widen: true

loss:
  ssim_weight: 0.15
  lpips_weight: 0.05
  lpips_last_frac: 0.10             # enable LPIPS for the final 10% of steps

train:
  batch_size: 32
  # 1e-3 diverged to NaN loss on the live Kaggle run, right as warmup finished
  # and LR hit its peak (compounded by a since-fixed AdamW beta2=0.9 bug --
  # see train.py). 5e-4 is the documented fallback; using it as the default now.
  lr: 5.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 2000
  grad_clip: 1.0
  budget_hours: 6.5                 # total_steps calibrated from measured it/s
  max_steps: 0                      # 0 = derive from budget_hours; >0 overrides
  val_every: 5000
  num_workers: 4
  amp: true
  channels_last: true
